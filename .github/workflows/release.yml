name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Cursor SDK the bridge is built against requires >= 22.13, and the native
      # better-sqlite3 binding baked into the runtime payload is ABI-locked to the major
      # version used here - a payload built on 22 will not load on a machine running 24.
      # Keep this equal to the Node the architects run; the manifest records it so the
      # updater refuses a mismatch instead of installing a silently dead norm library.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ---------------------------------------------------------------
      # Build MCP Server (TypeScript) and seed the norm library.
      # server/revit-data.db is gitignored, so nothing carries it into CI. A runtime
      # packaged around an empty database still answers every norm audit - with
      # "no violations", on models that have them. Build it here from the PDFs.
      # ---------------------------------------------------------------
      - name: Build MCP Server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Seed norm library
        working-directory: server
        run: |
          npm run seed:norms
          npm run seed:residential-norms

      - name: Verify norm library is not empty
        working-directory: server
        shell: pwsh
        run: |
          $script = "const D=require('better-sqlite3');" +
            "console.log(new D('revit-data.db',{readonly:true}).prepare('SELECT COUNT(*) c FROM norm_rules').get().c);"
          $rules = node -e $script
          Write-Host "norm_rules: $rules"
          if (-not $rules -or [int]$rules -lt 1) {
            throw "Norm library is empty - the release would report 0 violations on every model."
          }

      # ---------------------------------------------------------------
      # Build Plugin + CommandSet via combined solution
      # The commandset's DeployCommandSet target automatically copies
      # its output into the plugin's AddIn layout.
      #
      # 2023 is the floor, and it is not a preference - the command set calls API that
      # does not exist earlier: GeometryInstance.GetSymbolGeometryId/GetDocument (2023),
      # IndependentTag.GetTaggedLocalElementIds and ColorFillScheme (2022). The R20-R22
      # configurations stayed in the solution and never compiled, because until v1.1.0
      # this workflow had never run - the repository had no tags at all. Shipping them
      # would mean shipping compatibility shims nobody can test on any machine here.
      # ---------------------------------------------------------------
      - name: Build Revit 2023 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R23" -restore

      - name: Build Revit 2024 (.NET Framework 4.8)
        run: msbuild mcp-servers-for-revit.sln -p:Configuration="Release R24" -restore

      - name: Build Revit 2025 (.NET 8)
        run: dotnet build mcp-servers-for-revit.sln -c "Release R25"

      - name: Build Revit 2026 (.NET 8)
        run: dotnet build mcp-servers-for-revit.sln -c "Release R26"

      # ---------------------------------------------------------------
      # Stage the assistant runtime: bridge + MCP server + rules bundle +
      # norm library. Identical bytes for every Revit version, so it ships
      # as one asset instead of seven copies of node_modules.
      # ---------------------------------------------------------------
      - name: Stage assistant runtime
        shell: pwsh
        run: ./scripts/build-assistant-cursor.ps1 -StagingOnly

      # ---------------------------------------------------------------
      # Create Release Assets
      # The AddIn output already contains the complete deployable layout
      # (plugin + commandset) thanks to the DeployCommandSet build target.
      # manifest.json is what the auto-updater on an architect's machine reads.
      # ---------------------------------------------------------------
      - name: Create release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $outputDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          function New-Zip {
            param([string]$SourceDir, [string]$ZipPath)
            # Compress-Archive walks node_modules file by file and takes minutes over it;
            # ZipFile does the same tree in seconds. includeBaseDirectory:$false keeps the
            # entries relative to $SourceDir, which is the layout both installers expect.
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              (Resolve-Path $SourceDir).Path,
              (Join-Path (Get-Location) $ZipPath),
              [System.IO.Compression.CompressionLevel]::Optimal,
              $false)
          }

          function Get-AssetInfo {
            param([string]$Path)
            [ordered]@{
              asset     = Split-Path -Leaf $Path
              sha256    = (Get-FileHash $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              sizeBytes = (Get-Item $Path).Length
            }
          }

          $runtimeZip = "$outputDir/mcp-servers-for-revit-$version-runtime.zip"
          New-Zip -SourceDir "staging/assistant-cursor" -ZipPath $runtimeZip
          Write-Host "Created $runtimeZip"

          $plugins = [ordered]@{}
          $revitVersions = @(
            @{ Config = "Release R23"; Year = "2023" },
            @{ Config = "Release R24"; Year = "2024" },
            @{ Config = "Release R25"; Year = "2025" },
            @{ Config = "Release R26"; Year = "2026" }
          )

          foreach ($rv in $revitVersions) {
            $addinDir = "plugin/bin/AddIn $($rv.Year) $($rv.Config)"
            if (-not (Test-Path $addinDir)) {
              Write-Host "Warning: AddIn output not found: $addinDir"
              continue
            }
            $zipName = "$outputDir/mcp-servers-for-revit-$version-Revit$($rv.Year).zip"
            New-Zip -SourceDir $addinDir -ZipPath $zipName
            Write-Host "Created $zipName"
            $plugins[$rv.Year] = Get-AssetInfo $zipName
          }

          if ($plugins.Count -eq 0) { throw "No AddIn output was packaged." }

          $manifest = [ordered]@{
            version       = $version
            published     = (Get-Date).ToUniversalTime().ToString("o")
            builtWithNode = (node -v)
            minNode       = "22.13.0"
            runtime       = Get-AssetInfo $runtimeZip
            plugins       = $plugins
          }
          $manifestPath = "$outputDir/manifest.json"
          $manifest | ConvertTo-Json -Depth 6 | Set-Content $manifestPath -Encoding utf8
          Get-Content $manifestPath | Write-Host

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# There used to be an npm-publish job here. It pushed server/ to npm as
# mcp-server-for-revit, which this fork has no credentials for and no reason to do -
# the architects get the server inside the runtime payload, not from a registry. It
# failed on every release, and a pipeline that is always partly red teaches you to
# scroll past red. Recover it from git history if publishing ever becomes the plan.
